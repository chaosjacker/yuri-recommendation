    footer: "百合推荐表・台湾繁体／简体双语版<br>作品信息以原始推荐表内容为准。",
    categories: ["漫画","动漫","广播剧","小说","游戏"],
    unit: " 部",
    all: "全部"
  }
};

let currentLang = "tw";
let currentCat = null; // null = show all

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function renderTabs(){
  const u = ui[currentLang];
  const tabs = document.getElementById("tabs");
  const cats = [null, ...u.categories]; // null = 全部
  tabs.innerHTML = cats.map(cat => {
    const label = cat === null ? u.all : cat;
    const pressed = (currentCat === cat);
    return `<button class="tab" role="tab" aria-pressed="${pressed}" onclick="setCat(${cat === null ? 'null' : `'${cat}'`})">${esc(label)}</button>`;
  }).join("");
}

function render(){
  const catalog = currentLang === "tw" ? catalogTW : catalogCN;
  const u = ui[currentLang];
  const results = document.getElementById("results");
  const catsToShow = currentCat === null ? u.categories : [currentCat];
  
  results.innerHTML = catsToShow.map(cat => {
    const list = catalog[cat] || [];
    const cards = list.map(item => {
      const title = item["作品名稱"] || item["作品名称"] || item["遊戲"] || item["游戏"] || "未命名";
      const fields = Object.entries(item).filter(([k,v]) => v && !["作品名稱","作品名称","遊戲","游戏"].includes(k));
      return `<article class="card"><h2>${esc(title)}</h2>${fields.map(([k,v]) => `<div class="field"><span class="label">${esc(k)}</span>${esc(v).replace(/\n/g,"<br>")}</div>`).join("")}</article>`;
    }).join("");
    return `<section class="category-section"><h2 class="category-title">${esc(cat)} <span>${list.length}${u.unit}</span></h2><div class="grid">${cards || '<div class="empty">暫無作品</div>'}</div></section>`;
  }).join("");
}

function setLang(lang){
  currentLang = lang;
  // when switching language, try to keep the same category index if possible
  if (currentCat !== null) {
    const oldIdx = ui[lang === "tw" ? "cn" : "tw"].categories.indexOf(currentCat);
    if (oldIdx >= 0) currentCat = ui[lang].categories[oldIdx];
    else currentCat = null;
  }
  document.getElementById("btn-tw").classList.toggle("active", lang === "tw");
  document.getElementById("btn-cn").classList.toggle("active", lang === "cn");
  document.documentElement.lang = lang === "tw" ? "zh-Hant" : "zh-Hans";
  const u = ui[lang];
  document.getElementById("main-title").textContent = u.title;
  document.getElementById("main-desc").textContent = u.desc;
  document.getElementById("intro").textContent = u.intro;
  document.getElementById("footer").innerHTML = u.footer;
  document.title = u.title + "｜雙語版";
  renderTabs();
  render();
}

function setCat(cat){
  currentCat = cat;
  renderTabs();
  render();
  // scroll to top of results for better UX on mobile
  document.getElementById("results").scrollIntoView({behavior:"smooth", block:"start"});
}
